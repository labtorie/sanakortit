<style>
/* Layout: one-screen phone app — stats strip, card stage, bottom tab bar. Lake-night ink, snow ground, cloudberry accent. */
:root {

  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }

html { height: 100%; box-sizing: border-box; } body { height: 100%; }
* { box-sizing: border-box; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 8px; display: flex; flex-direction: column; gap: 10px; }

.progress { display: flex; flex-direction: column; gap: 6px; }

.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }

.flip.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 18px 20px; overflow: hidden; }
.front { background: var(--surface); }

.back .tag { background: color-mix(in srgb, var(--back-ink) 14%, transparent); color: var(--back-ink); }

.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 20px; }

.empty p { color: var(--muted); margin: 0; max-width: 30ch; line-height: 1.5; }

/* Buttons & forms */
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }

.field textarea, .field input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 1.1rem; resize: none; }
.field textarea:focus, .field input:focus { outline: none; border-color: var(--accent); }

.linkbtn { border: 0; background: none; color: var(--accent); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 0; }
.status { font-size: .8rem; color: var(--muted); min-height: 1.2em; }

.clr-wrap { position: relative; }

.clr { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.clr::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface-2); z-index: -1; }
.clr { z-index: 0; isolation: isolate; }
.clr[hidden] { display: none; }
.dup { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-size: .86rem; line-height: 1.35; }
.dup[hidden] { display: none; }
.dup .t { flex: 1; min-width: 0; }

#view-add .form { min-height: 100%; }
#view-add { padding-bottom: 0; }

/* keyboard open on the add screen: give the fields all the room */
html.kb .top, html.kb .tabs { display: none; }
.add-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* List */
.list-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }

.group { display: flex; flex-direction: column; }

<script>
(() => {
  const LEARNED = 3;           // correct answers in a row on cards → learned
  const QKNOWN = 3;            // correct answers in a row in the quiz → "guessed in quiz" (counted separately)
  const MAXBOX = 5;
  const LS_CARDS = 'sanakortit.cards.v1';
  const LS_PREFS = 'sanakortit.prefs.v1';
  const LS_TODAY = 'sanakortit.today.v1';
  const $ = s => document.querySelector(s);

  const STARTER = [
    ['kiitos','спасибо'],['hei','привет'],['anteeksi','извините'],['talo','дом'],['vesi','вода'],
    ['kirja','книга'],['ystävä','друг'],['kaunis','красивый'],['nopeasti','быстро'],['puhua','говорить'],
    ['syödä','есть, кушать'],['juna','поезд'],['kauppa','магазин'],['tänään','сегодня'],['huomenna','завтра'],
    ['Hyvää huomenta!','Доброе утро!'],['Mitä kuuluu?','Как дела?'],['En ymmärrä.','Я не понимаю.'],
    ['Missä on asema?','Где вокзал?'],['Puhutko englantia?','Ты говоришь по-английски?']
  ];

  // ---------- storage ----------
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const S = {
    cards: ls.get(LS_CARDS, []).map(c => Object.assign({ qbox: 0, qseen: 0, qright: 0, qwrong: 0 }, c)),
    prefs: Object.assign({ dir: 'fi', filter: 'all', sort: 'added' }, ls.get(LS_PREFS, {})),
    currentId: null, flipped: false, undo: null, recent: []
  };
  // ---------- Telegram ----------
  const TGW = window.Telegram && window.Telegram.WebApp;
  const TG = TGW && TGW.initData ? TGW : null;           // non-null only inside Telegram
  const tgAtLeast = v => { try { return !!TG && TG.isVersionAtLeast(v); } catch { return false; } };
  // ---------- haptics ----------
  // Telegram: native HapticFeedback (iOS Taptic Engine + Android).
  // iOS Safari / home-screen app (iOS 18+): toggling a hidden <input switch> plays the system tick.
  // Android browsers: navigator.vibrate.
  const H = (() => {
    const tg = (kind, v) => { try { if (tgAtLeast('6.1')) { TG.HapticFeedback[kind](v); return true; } } catch {} return false; };
    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const canVibrate = !isIOS && typeof navigator.vibrate === 'function';
    let sw = null;
    const iosTick = () => {
      if (!sw) {
        const box = document.createElement('div'); box.setAttribute('aria-hidden', 'true');
        box.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
        const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.id = 'haptic-switch'; inp.tabIndex = -1;
        sw = document.createElement('label'); sw.htmlFor = 'haptic-switch';
        box.append(inp, sw); document.body.append(box);
      }
      const prev = document.activeElement;
      try { sw.click(); } catch {}
      // the label click focuses the hidden switch; give focus back so keyboard shortcuts keep working
      const inp = document.getElementById('haptic-switch');
      if (document.activeElement === inp) { inp.blur(); if (prev && prev !== document.body && prev.focus) try { prev.focus({ preventScroll: true }); } catch {} }
    };
    const web = (pattern, ticks, gap) => {
      if (canVibrate) { try { navigator.vibrate(pattern); } catch {} }
      else if (isIOS) { iosTick(); for (let i = 1; i < ticks; i++) setTimeout(iosTick, i * (gap || 70)); }
    };
    return {
      tick()    { tg('selectionChanged') || web(6, 1); },                       // flip, toggles, tabs
      detent()  { tg('impactOccurred', 'soft') || web(10, 1); },                // swipe crosses the "will count" line
      good()    { tg('impactOccurred', 'light') || web([10, 50, 16], 2, 60);    // remembered: light double tap
                  if (TG) setTimeout(() => tg('impactOccurred', 'medium'), 70); },
      bad()     { tg('impactOccurred', 'rigid') || web(22, 1); },               // not remembered: one firm knock, no error buzz
      learned() { tg('notificationOccurred', 'success') || web([12, 60, 12, 60, 28], 3, 75); },
      saved()   { tg('notificationOccurred', 'success') || web([10, 50, 16], 2, 60); },
      warn()    { tg('notificationOccurred', 'warning') || web([20, 40, 20], 2, 60); },
    };
  })();
  const backStack = [];
  function pushBack(fn) { backStack.push(fn); if (tgAtLeast('6.1')) TG.BackButton.show(); }
  function popBack(fn) { const i = backStack.lastIndexOf(fn); if (i >= 0) backStack.splice(i, 1); if (tgAtLeast('6.1') && !backStack.length) TG.BackButton.hide(); }
  function rgbToHex(c) { const m = c.match(/\d+/g); return m ? '#' + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') : null; }
  function initTelegram() {
    if (!TG) return;
    document.documentElement.classList.add('tg');
    TG.ready(); TG.expand();
    if (tgAtLeast('7.7')) try { TG.disableVerticalSwipes(); } catch {}
    const applyTheme = () => {
      document.documentElement.dataset.theme = TG.colorScheme === 'dark' ? 'dark' : 'light';
      const bg = rgbToHex(getComputedStyle(document.body).backgroundColor);
      if (bg && tgAtLeast('6.1')) try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch {}
      if (bg && tgAtLeast('7.10')) try { TG.setBottomBarColor(rgbToHex(getComputedStyle($('.tabs')).backgroundColor) || bg); } catch {}
    };
    applyTheme(); TG.onEvent('themeChanged', applyTheme);
    if (tgAtLeast('6.1')) TG.BackButton.onClick(() => { const f = backStack[backStack.length - 1]; if (f) f(); });
  }

  // ---------- Telegram CloudStorage sync ----------
  // Cards are packed into JSON chunks under keys d0..dN, count under "dn".
  // Each chunk is kept under 3500 UTF-8 bytes (Cyrillic = 2 bytes/char), safely below the 4096 limit however a client counts it.
  // LS_DIRTY marks local changes the cloud hasn't confirmed yet; on the next start they are merged into the cloud copy, not overwritten by it.
  const LS_DIRTY = 'sanakortit.dirty.v1';
  const LS_SYNCED = 'sanakortit.synced.v1';
  const cloud = tgAtLeast('6.9') ? TG.CloudStorage : null;
  const cerr = e => new Error(typeof e === 'string' ? e : (e && e.message) || 'unknown');
  const cget = keys => new Promise((res, rej) => cloud.getItems(keys, (e, v) => e ? rej(cerr(e)) : res(v || {})));
  const cset = (k, v) => new Promise((res, rej) => cloud.setItem(k, v, (e, ok) => e || ok === false ? rej(cerr(e || 'setItem failed')) : res()));
  const cdel = keys => new Promise(res => cloud.removeItems(keys, () => res()));
  const CHUNK = 3500;
  const enc = new TextEncoder(), blen = s => enc.encode(s).length;
  let cloudReady = false, lastChunks = [], saveT = null, retryT = null, saving = Promise.resolve(), rev = 0;
  let sync = { state: cloud ? 'connecting' : 'off', err: '' };
  const isDirty = () => { try { return localStorage.getItem(LS_DIRTY) === '1' || (localStorage.getItem(LS_SYNCED) !== '1' && S.cards.length > 0); } catch { return true; } };
  const setDirty = v => { try { if (v) localStorage.setItem(LS_DIRTY, '1'); else { localStorage.removeItem(LS_DIRTY); localStorage.setItem(LS_SYNCED, '1'); } } catch {} };
  const pack = c => [c.id, c.fi, c.ru, c.type === 'phrase' ? 1 : 0, c.box, c.seen, c.right, c.wrong, c.last, c.created, c.qbox || 0, c.qseen || 0, c.qright || 0, c.qwrong || 0];
  const unpack = a => ({ id: String(a[0]), fi: String(a[1]), ru: String(a[2]), type: a[3] ? 'phrase' : 'word', box: a[4] | 0, seen: a[5] | 0, right: a[6] | 0, wrong: a[7] | 0, last: a[8] || 0, created: a[9] || 0, qbox: a[10] | 0, qseen: a[11] | 0, qright: a[12] | 0, qwrong: a[13] | 0 });
  function toChunks() {
    const out = []; let cur = [], len = 2;
    for (const c of S.cards) {
      const s = JSON.stringify(pack(c)), n = blen(s);
      if (len + n + 1 > CHUNK && cur.length) { out.push('[' + cur.join(',') + ']'); cur = []; len = 2; }
      cur.push(s); len += n + 1;
    }
    if (cur.length) out.push('[' + cur.join(',') + ']');
    return out;
  }
  function renderSync() {
    const el = $('#storage-hint'); if (!el) return;
    const n = S.cards.length, w = n + ' ' + plural(n, ['карточка', 'карточки', 'карточек']);
    const msg = {
      off: 'Карточки хранятся только в этом браузере. Сохраняй CSV, чтобы не потерять их.',
      connecting: 'Подключаюсь к облаку Telegram…',
      saving: 'Сохраняю в облако Telegram…',
      ok: 'В облаке Telegram: ' + w + '. Видно на всех твоих устройствах.',
      error: 'Облако Telegram недоступно (' + sync.err + '). Карточки сохранены на этом устройстве, повторю попытку.'
    }[sync.state];
    el.textContent = msg; el.classList.toggle('bad', sync.state === 'error');
    let b = $('#sync-retry');
    if (sync.state === 'error') {
      if (!b) { b = document.createElement('button'); b.id = 'sync-retry'; b.type = 'button'; b.className = 'linkish'; b.textContent = 'Повторить сейчас'; el.after(b);
        b.onclick = () => { H.tick(); clearTimeout(retryT); cloudReady ? cloudSave() : connectCloud(); }; }
    } else if (b) b.remove();
  }
  function setSync(state, err) { sync = { state, err: err || '' }; renderSync(); }
  function scheduleCloudSave() { if (!cloud || !cloudReady) return; clearTimeout(saveT); saveT = setTimeout(cloudSave, 400); }
  function cloudSave() {
    clearTimeout(saveT); clearTimeout(retryT);
    const myRev = rev;
    setSync('saving');
    saving = saving.then(async () => {
      const ch = toChunks(), prevLen = lastChunks.length, dnOk = lastChunks.dn;
      for (let i = 0; i < ch.length; i++) if (ch[i] !== lastChunks[i]) { await cset('d' + i, ch[i]); lastChunks[i] = ch[i]; }
      if (ch.length !== prevLen || !dnOk) {
        await cset('dn', String(ch.length));
        const extra = []; for (let i = ch.length; i < prevLen; i++) extra.push('d' + i);
        if (extra.length) await cdel(extra);
      }
      lastChunks = ch.slice(); lastChunks.dn = true;
      if (rev === myRev) setDirty(false);
      setSync('ok');
    }).catch(e => {
      lastChunks = lastChunks.slice(); lastChunks.dn = false;   // force a full re-check next time
      setSync('error', e.message); if (window.__report) window.__report('sync-save', e.message);
      retryT = setTimeout(cloudSave, 15000);
    });
    return saving;
  }
  // union by id; same id → the copy reviewed more recently; drop local-only duplicates of a word already in the cloud
  function mergeCards(remote, local) {
    const byId = new Map(remote.map(c => [c.id, c]));
    const key = c => c.fi.trim().toLowerCase();
    const known = new Set(remote.map(key));
    const out = remote.slice(); let added = 0;
    for (const c of local) {
      const r = byId.get(c.id);
      if (r) { if ((c.last || 0) > (r.last || 0) || (c.seen + c.qseen) > (r.seen + r.qseen)) out[out.indexOf(r)] = c; }
      else if (!known.has(key(c))) { out.push(c); known.add(key(c)); added++; }
    }
    return { cards: out, added };
  }
  async function connectCloud() {
    if (!cloud) return;
    clearTimeout(retryT); setSync('connecting');
    try {
      const meta = await cget(['dn']);
      const n = parseInt(meta.dn || '0', 10) || 0;
      const remote = [];
      if (n > 0) {
        const keys = Array.from({ length: n }, (_, i) => 'd' + i), vals = {};
        for (let i = 0; i < keys.length; i += 20) Object.assign(vals, await cget(keys.slice(i, i + 20)));
        lastChunks = keys.map(k => vals[k] || ''); lastChunks.dn = true;
        lastChunks.forEach(s => { try { JSON.parse(s).forEach(a => remote.push(unpack(a))); } catch {} });
      }
      const dirty = isDirty();
      let push = false, added = 0;
      if (dirty && S.cards.length) {
        const m = mergeCards(remote, S.cards); S.cards = m.cards; added = m.added; push = true;
      } else if (n > 0) {
        S.cards = remote;
      }
      saveLocal();
      cloudReady = true;
      if (push) { await cloudSave(); if (added) toast('Отправил в облако ' + added + ' ' + plural(added, ['карточку', 'карточки', 'карточек']) + ' с этого устройства'); }
      else { setDirty(false); setSync('ok'); }
      refreshAll(false);
    } catch (e) {
      setSync('error', e.message); if (window.__report) window.__report('sync-load', e.message);
      retryT = setTimeout(connectCloud, 10000);
    }
  }
  // flush pending changes when the app goes to background / is being closed
  document.addEventListener('visibilitychange', () => { if (document.hidden && cloudReady && saveT) cloudSave(); });

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function saveLocal() { ls.set(LS_CARDS, S.cards); if (sync.state === 'ok') renderSync(); }
  function persist() { rev++; saveLocal(); if (cloud) setDirty(true); scheduleCloudSave(); }
  function putCard(c, silent) {
    const i = S.cards.findIndex(x => x.id === c.id);
    if (i >= 0) S.cards[i] = c; else S.cards.push(c);
    if (!silent) persist();
  }
  function removeCard(id) {
    S.cards = S.cards.filter(c => c.id !== id); persist();
  }
  function newCard(fi, ru, type) {
    return { id: uid(), fi, ru, type, box: 0, seen: 0, right: 0, wrong: 0, last: 0, created: Date.now(), qbox: 0, qseen: 0, qright: 0, qwrong: 0 };

  // ---------- CSV import / export ----------
  const CYR = /[а-яё]/i;
  function parseDelimited(text, d) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
      else if (ch === '"' && !f.trim()) { q = true; f = ''; }
      else if (ch === d) { row.push(f); f = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += ch;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  // Accepts CSV with , ; or tab, or plain lines like "kiitos — спасибо". Columns: Finnish, translation, [type].
  function parseImport(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/).find(l => l.trim()) || '';
    const delims = ['\t', ';', ','].map(d => [d, first.split(d).length - 1]).sort((a, b) => b[1] - a[1]);
    let rows;
    if (delims[0][1] > 0) rows = parseDelimited(text, delims[0][0]);
    else rows = text.split(/\r?\n/).map(l => { const m = l.match(/^(.*?)\s+[—–-]\s+(.*)$/) || l.match(/^(.*?)\s*=\s*(.*)$/); return m ? [m[1], m[2]] : [l]; });
    rows = rows.map(r => r.map(x => (x || '').trim())).filter(r => r.some(Boolean));
    let fiI = 0, ruI = 1, tyI = 2;
    if (rows.length) {
      const h = rows[0].map(x => x.toLowerCase());
      const find = re => h.findIndex(x => re.test(x));
      const hf = find(/^(fi|fin|finnish|suomi|suomeksi|sana|финский|по-фински|слово|word|term)$/), hr = find(/^(ru|rus|russian|venäjä|перевод|русский|по-русски|translation|meaning)$/);
      if (hf >= 0 && hr >= 0 && hf !== hr) { rows.shift(); fiI = hf; ruI = hr; tyI = find(/^(type|тип|tyyppi)$/); }   // header row needs both column names
    }
    return rows.map(r => {
      let fi = r[fiI] || '', ru = r[ruI] || '';
      if (CYR.test(fi) && ru && !CYR.test(ru)) [fi, ru] = [ru, fi];   // columns the other way round
      const t = (tyI >= 0 && r[tyI] || '').toLowerCase();
      const type = /phrase|sentence|фраз|предлож|lause/.test(t) ? 'phrase' : /word|слово|sana/.test(t) ? 'word' : (/\s/.test(fi) ? 'phrase' : 'word');
      return { fi, ru, type };
    }).filter(x => x.fi);
  }

    return 'finnish,translation,type\n' + S.cards.map(c => [c.fi, c.ru, c.type].map(esc).join(',')).join('\n') + '\n';

  function openDebug() {
    let lines = []; try { lines = JSON.parse(localStorage.getItem('sanakortit.log.v1') || '[]'); } catch {}
    const text = (window.__env ? window.__env() : navigator.userAgent) + '\ncards ' + S.cards.length + ' · sync ' + sync.state + (sync.err ? ' (' + sync.err + ')' : '') + '\n\n' + (lines.join('\n') || 'журнал пуст');
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', 'Отладка');
    sh.innerHTML = '<div class="form"><h2>Отладка</h2><div class="field"><textarea class="mono" rows="12" readonly></textarea></div><div class="row-btns"><button class="btn" type="button" data-a="send">Отправить отчёт</button><button class="btn ghost-btn" type="button" data-a="close">Закрыть</button></div></div>';
    sh.querySelector('textarea').value = text;
    scrim.append(sh); document.body.append(scrim);
    const close = () => { scrim.remove(); popBack(close); };
    pushBack(close);
    scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
    sh.querySelector('[data-a=close]').onclick = close;
    sh.querySelector('[data-a=send]').onclick = () => { if (window.__report) window.__report('manual', text, true); H.saved(); toast('Отчёт отправлен'); close(); };
  }

  let view = 'study';
  function go(v) {
    if (v !== view) H.tick();
    view = v;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    ['study', 'quiz', 'add', 'list'].forEach(n => $('#view-' + n).hidden = n !== v);
    if (v === 'list') renderList();
    if (v === 'study') renderStudy(false);
    if (v === 'quiz') { if (!Q || Q.answered !== null || !S.cards.some(x => x.id === Q.id)) newQuestion(); else renderQuiz(false); }
    if (v === 'add' && !matchMedia('(pointer: coarse)').matches) setTimeout(() => src.focus(), 50);   // on phones don't pop the keyboard (and hide the tabs) on arrival
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  function syncSeg() {
    document.querySelectorAll('.dir-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === S.prefs.dir)));
    document.querySelectorAll('.filter-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.prefs.filter)));
  }
  const rerenderMode = () => { if (view === 'quiz') newQuestion(); else renderStudy(true); };
  document.querySelectorAll('.dir-seg button').forEach(b => b.addEventListener('click', () => { if (S.prefs.dir === b.dataset.dir) return; H.tick(); S.prefs.dir = b.dataset.dir; ls.set(LS_PREFS, S.prefs); syncSeg(); S.flipped = false; rerenderMode(); }));
  document.querySelectorAll('.filter-seg button').forEach(b => b.addEventListener('click', () => { if (S.prefs.filter === b.dataset.f) return; H.tick(); S.prefs.filter = b.dataset.f; ls.set(LS_PREFS, S.prefs); syncSeg(); S.recent = []; qRecent = []; S.currentId = null; rerenderMode(); }));
  $('#btn-flip').onclick = () => setFlip(!S.flipped);
  $('#btn-yes').onclick = () => commit(true);
  $('#btn-no').onclick = () => commit(false);
  const isTyping = () => { const a = document.activeElement; return !!a && a.matches('textarea, input:not([type=checkbox]):not([type=file])'); };
  document.addEventListener('keydown', e => {
    if (view === 'quiz' && !document.querySelector('.scrim') && !isTyping()) {
      if (/^[1-4]$/.test(e.key) && Q) { if (Q.answered === null) answer(+e.key - 1); else newQuestion(); }
      else if ((e.key === 'Enter' || e.key === ' ') && Q && Q.answered !== null) { e.preventDefault(); newQuestion(); }
      return;
    }
    if (view !== 'study' || document.querySelector('.scrim') || isTyping()) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlip(!S.flipped); }
    else if (e.key === 'ArrowRight') commit(true);
    else if (e.key === 'ArrowLeft') commit(false);
  });

  let shownSig = '';
  const sigOf = () => { const c = S.cards.find(x => x.id === S.currentId); return [S.cards.length, S.prefs.dir, S.prefs.filter, c ? c.id + c.fi + c.ru + c.type + c.box : ''].join('|'); };
  function refreshAll(enter) {
    renderStats();
    // skip re-rendering the card when nothing visible changed (e.g. our own write echoing back) or while dragging
    if (view === 'study' && !busy && !document.querySelector('.swipe[data-drag="1"]') && sigOf() !== shownSig) renderStudy(enter);
    if (view === 'list') renderList();
    if (view === 'add') updateDup();
    // quiz: keep the open question unless its card (or an option) disappeared
    if (view === 'quiz' && (!Q || !Q.opts.every(id => S.cards.some(x => x.id === id)))) newQuestion();
  }

  initTelegram();
  renderSync();
  syncSeg(); renderToday(); refreshAll(true);
  connectCloud();
  if (window.__bootOk) window.__bootOk();
})();
</script>

</body>
