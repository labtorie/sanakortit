<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C141E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sanakortit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sanakortit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app — stats strip, card stage, bottom tab bar. Lake-night ink, snow ground, cloudberry accent. */
:root {
  --bg: #EDF1F5;
  --surface: #FFFFFF;
  --surface-2: #E3E9EF;
  --ink: #13233A;
  --muted: #5A6A7D;
  --line: #D3DCE5;
  --accent: #D9821F;
  --accent-ink: #FFFFFF;
  --back: #13233A;
  --back-ink: #EEF3F8;
  --good: #2A8A5E;
  --bad: #CC463C;
  --shadow: 0 1px 2px rgba(19,35,58,.08), 0 10px 30px rgba(19,35,58,.10);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C141E; --surface: #152131; --surface-2: #1C2A3C; --ink: #E5ECF3; --muted: #8B9AAC; --line: #263548;
  --accent: #F0A243; --accent-ink: #1A1206; --back: #22344D; --back-ink: #F1F5F9; --good: #47B585; --bad: #E66A5F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C141E; --surface: #152131; --surface-2: #1C2A3C; --ink: #E5ECF3; --muted: #8B9AAC; --line: #263548;
  --accent: #F0A243; --accent-ink: #1A1206; --back: #22344D; --back-ink: #F1F5F9; --good: #47B585; --bad: #E66A5F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }

html { height: 100%; box-sizing: border-box; } body { height: 100%; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 8px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; margin: 0; letter-spacing: -.01em; }
.brand h1 span { color: var(--accent); }
.brand .today { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .row { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress .row b { color: var(--ink); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 3px; transition: width .4s ease; }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 16px; }

/* Study */
#view-study { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 999px; font-size: .8rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.controls .spacer { flex: 1; }

.stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: stretch; justify-content: center; perspective: 1200px; }
.ghost { position: absolute; inset: 14px 10px -8px; border-radius: 22px; background: var(--surface); opacity: .55; transform: scale(.96); box-shadow: var(--shadow); }
.swipe { position: absolute; inset: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.swipe.anim { transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s; }
.swipe.enter { animation: enter .26s ease-out; }
@keyframes enter { from { transform: scale(.94) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.2,1); }
.flip.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 18px 20px; overflow: hidden; }
.front { background: var(--surface); }
.back { background: var(--back); color: var(--back-ink); transform: rotateY(180deg); }
.face .meta { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.back .meta { color: color-mix(in srgb, var(--back-ink) 65%, transparent); }
.face .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; min-height: 0; }
.word { font-family: var(--f-display); font-weight: 700; line-height: 1.12; letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
.sub { font-size: .95rem; opacity: .7; overflow-wrap: anywhere; }
.hint { font-size: .78rem; color: var(--muted); text-align: center; }
.dots { display: flex; gap: 5px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--good); }
.back .dots i { background: color-mix(in srgb, var(--back-ink) 25%, transparent); }
.back .dots i.on { background: var(--good); }
.speak { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.back .speak { background: color-mix(in srgb, var(--back-ink) 14%, transparent); color: var(--back-ink); }
.tag { font-size: .68rem; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); letter-spacing: .06em; }
.back .tag { background: color-mix(in srgb, var(--back-ink) 14%, transparent); color: var(--back-ink); }

.stamp { position: absolute; top: 22px; padding: 6px 12px; border-radius: 10px; border: 3px solid; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; letter-spacing: .04em; opacity: 0; pointer-events: none; z-index: 3; text-transform: uppercase; background: var(--surface); }
.stamp.yes { left: 20px; color: var(--good); border-color: var(--good); transform: rotate(-10deg); }
.stamp.no { right: 20px; color: var(--bad); border-color: var(--bad); transform: rotate(10deg); }

.actions { display: flex; justify-content: center; align-items: center; gap: 22px; padding-bottom: 4px; }
.round { border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); transition: transform .12s; }
.round:active { transform: scale(.92); }
.round.big { width: 62px; height: 62px; }
.round.small { width: 46px; height: 46px; color: var(--muted); }
.round.no { color: var(--bad); }
.round.yes { color: var(--good); }

.empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 20px; }
.empty h2 { font-family: var(--f-display); font-size: 1.5rem; margin: 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 30ch; line-height: 1.5; }

/* Buttons & forms */
.btn { border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost-btn { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--bad); padding-inline: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.form { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.form h2 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.field textarea, .field input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 1.1rem; resize: none; }
.field textarea:focus, .field input:focus { outline: none; border-color: var(--accent); }
.field textarea.big { font-family: var(--f-display); font-size: 1.3rem; font-weight: 500; }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 0; }
.status { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--bad); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row-btns .btn:first-child { flex: 1; }

/* List */
.list-head { display: flex; flex-direction: column; gap: 10px; position: sticky; top: -4px; background: var(--bg); padding-block: 4px 10px; z-index: 2; }
.list { display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: var(--surface); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .fi { font-weight: 600; overflow-wrap: anywhere; }
.item .ru { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.item .dots i { width: 6px; height: 6px; }
.badge { font-size: .7rem; font-weight: 600; color: var(--good); }
.backup { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; }
.backup .hint { margin: 0; line-height: 1.45; }
.counts { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Tabs */
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--accent); }

/* Sheet & toast */
.scrim { position: fixed; inset: 0; background: rgba(8,14,22,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92%; overflow-y: auto; }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: .88rem; display: flex; gap: 14px; align-items: center; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }
@media (prefers-reduced-motion: reduce) { .flip, .swipe.anim, .bar i { transition: none; } .swipe.enter { animation: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Sana<span>kortit</span></h1><span class="today" id="today"></span></div>
    <div class="progress">
      <div class="row"><span>Выучено <b id="learned-n">0</b> из <b id="total-n">0</b></span><span id="learned-pct">0%</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <main>
    <section class="view" id="view-study">
      <div class="controls">
        <div class="seg" id="dir-seg" role="group" aria-label="Направление">
          <button data-dir="fi" aria-pressed="true">FI → RU</button>
          <button data-dir="ru" aria-pressed="false">RU → FI</button>
        </div>
        <span class="spacer"></span>
        <div class="seg" id="filter-seg" role="group" aria-label="Что учить">
          <button data-f="all" aria-pressed="true">Всё</button>
          <button data-f="word" aria-pressed="false">Слова</button>
          <button data-f="phrase" aria-pressed="false">Фразы</button>
        </div>
      </div>
      <div class="stage" id="stage"></div>
      <div class="actions" id="actions">
        <button class="round big no" id="btn-no" aria-label="Не помню">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button class="round small" id="btn-flip" aria-label="Перевернуть">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <button class="round big yes" id="btn-yes" aria-label="Помню">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </div>
    </section>

    <section class="view" id="view-add" hidden>
      <form class="form" id="add-form" autocomplete="off">
        <h2>Новая карточка</h2>
        <div class="seg" id="type-seg" role="group" aria-label="Тип">
          <button type="button" data-t="word" aria-pressed="true">Слово</button>
          <button type="button" data-t="phrase" aria-pressed="false">Фраза / предложение</button>
        </div>
        <div class="field">
          <label for="add-src"><span id="src-label">По-фински</span><button type="button" class="linkbtn" id="swap-lang">Пишу по-русски ⇄</button></label>
          <textarea id="add-src" class="big" rows="2" placeholder="например, ystävä" autocapitalize="off" spellcheck="false"></textarea>
        </div>
        <div class="field">
          <label for="add-dst"><span id="dst-label">Перевод</span><button type="button" class="linkbtn" id="retranslate">Перевести</button></label>
          <textarea id="add-dst" rows="2" placeholder="подтянется автоматически, можно править"></textarea>
          <div class="status" id="tr-status"></div>
        </div>
        <div class="row-btns"><button class="btn" id="save-btn" type="submit" disabled>Сохранить карточку</button></div>
      </form>
    </section>

    <section class="view" id="view-list" hidden>
      <div class="list-head">
        <div class="field"><input id="search" type="search" placeholder="Поиск по словам" aria-label="Поиск"></div>
        <div class="counts" id="list-counts"></div>
      </div>
      <div class="list" id="list"></div>
      <div class="backup">
        <p class="hint">Карточки хранятся только в этом браузере. Сохраняй копию, чтобы перенести их на другое устройство или не потерять.</p>
        <div class="row-btns" style="justify-content:center">
          <button class="btn ghost-btn" type="button" id="export-btn">Скачать копию</button>
          <button class="btn ghost-btn" type="button" id="import-btn">Загрузить копию</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="study" aria-selected="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h9.5A2.5 2.5 0 0 1 20 5.5V17"/></svg>Учить</button>
    <button role="tab" data-view="add" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Добавить</button>
    <button role="tab" data-view="list" aria-selected="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Слова</button>
  </nav>
</div>

<script>
(() => {
  const LEARNED = 3;           // correct answers in a row → learned
  const MAXBOX = 5;
  const LS_CARDS = 'sanakortit.cards.v1';
  const LS_PREFS = 'sanakortit.prefs.v1';
  const LS_TODAY = 'sanakortit.today.v1';
  const $ = s => document.querySelector(s);

  const STARTER = [
    ['kiitos','спасибо'],['hei','привет'],['anteeksi','извините'],['talo','дом'],['vesi','вода'],
    ['kirja','книга'],['ystävä','друг'],['kaunis','красивый'],['nopeasti','быстро'],['puhua','говорить'],
    ['syödä','есть, кушать'],['juna','поезд'],['kauppa','магазин'],['tänään','сегодня'],['huomenna','завтра'],
    ['Hyvää huomenta!','Доброе утро!'],['Mitä kuuluu?','Как дела?'],['En ymmärrä.','Я не понимаю.'],
    ['Missä on asema?','Где вокзал?'],['Puhutko englantia?','Ты говоришь по-английски?']
  ];

  // ---------- storage ----------
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const S = {
    cards: ls.get(LS_CARDS, []),
    prefs: Object.assign({ dir: 'fi', filter: 'all' }, ls.get(LS_PREFS, {})),
    currentId: null, flipped: false, undo: null, recent: []
  };
  let col = null; // db collection when available

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clean = c => { const { id, ...rest } = c; return rest; };
  function saveLocal() { ls.set(LS_CARDS, S.cards); }
  function putCard(c) {
    const i = S.cards.findIndex(x => x.id === c.id);
    if (i >= 0) S.cards[i] = c; else S.cards.push(c);
    saveLocal();
    if (col) col.doc(c.id).set(clean(c)).catch(() => toast('Не удалось сохранить в облако — карточка осталась на этом устройстве'));
  }
  function removeCard(id) {
    S.cards = S.cards.filter(c => c.id !== id); saveLocal();
    if (col) col.doc(id).delete().catch(() => {});
  }
  function newCard(fi, ru, type) {
    return { id: uid(), fi, ru, type, box: 0, seen: 0, right: 0, wrong: 0, last: 0, created: Date.now() };
  }

  async function connectDb() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.collection('data/users/' + id + '/cards');
      let first = true;
      ref.onSnapshot(snap => {
        const remote = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        if (first) {
          first = false; col = ref;
          // upload cards that exist only on this device
          const have = new Set(remote.map(c => c.id));
          S.cards.filter(c => !have.has(c.id)).forEach(c => { remote.push(c); ref.doc(c.id).set(clean(c)).catch(() => {}); });
        }
        S.cards = remote; saveLocal(); refreshAll(false);
      }, () => {});
    } catch {}
  }

  // ---------- today counter ----------
  function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
  function bumpToday(n) {
    const t = ls.get(LS_TODAY, {}); const k = todayKey();
    const v = t.d === k ? t.n : 0; ls.set(LS_TODAY, { d: k, n: Math.max(0, v + n) }); renderToday();
  }
  function renderToday() {
    const t = ls.get(LS_TODAY, {}); const n = t.d === todayKey() ? t.n : 0;

  }
  function plural(n, f) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? f[1] : f[2]; }

  // ---------- picking ----------
  const pool = () => S.cards.filter(c => S.prefs.filter === 'all' || c.type === S.prefs.filter);
  function weight(c) {
    if (c.box >= LEARNED) return 0.5 + (MAXBOX - c.box) * 0.25;  // learned: rarely
    if (!c.seen) return 5;                                       // new: often
    return 7 - c.box * 1.6 + Math.min(c.wrong, 4) * 0.5;         // struggling: most often
  }
  function pickNext() {
    const p = pool(); if (!p.length) return null;
    let cand = p.filter(c => !S.recent.includes(c.id));
    if (!cand.length) cand = p.filter(c => c.id !== S.currentId);
    if (!cand.length) cand = p;
    const ws = cand.map(weight), sum = ws.reduce((a, b) => a + b, 0);
    let r = Math.random() * sum;
    for (let i = 0; i < cand.length; i++) { r -= ws[i]; if (r <= 0) return cand[i]; }
    return cand[cand.length - 1];
  }
  function advance() {
    const c = pickNext(); S.currentId = c ? c.id : null; S.flipped = false;

    renderStudy(true);
  }

  }

    const yes = document.createElement('div'); yes.className = 'stamp yes'; yes.textContent = 'Помню';

    const fiFirst = S.prefs.dir === 'fi';

    flip.append(
      face('front', fiFirst ? 'suomi' : 'русский', q, '', c, fiFirst ? c.fi : null),
      face('back', fiFirst ? 'перевод' : 'suomeksi', a, q, c, fiFirst ? null : c.fi)

  }

  function setFlip(v) { S.flipped = v; const f = stage.querySelector('.flip'); if (f) f.classList.toggle('flipped', v); }

  function attachSwipe(sw, flip, yes, no) {
    let sx = 0, sy = 0, dx = 0, t0 = 0, down = false, moved = false, horiz = null;
    sw.addEventListener('pointerdown', e => { down = true; sw.dataset.drag = '1'; moved = false; horiz = null; sx = e.clientX; sy = e.clientY; dx = 0; t0 = performance.now(); sw.classList.remove('anim', 'enter'); try { sw.setPointerCapture(e.pointerId); } catch {} });
    sw.addEventListener('pointermove', e => {
      if (!down) return;
      const ddx = e.clientX - sx, ddy = e.clientY - sy;
      if (horiz === null && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) horiz = Math.abs(ddx) >= Math.abs(ddy);
      if (!horiz) { if (horiz === false) moved = true; return; }
      moved = true; dx = ddx;
      sw.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
      const k = Math.min(1, Math.abs(dx) / 110);
      yes.style.opacity = dx > 0 ? k : 0; no.style.opacity = dx < 0 ? k : 0;
    });
    const end = e => {
      if (!down) return; down = false; sw.dataset.drag = '';
      if (!moved) { setFlip(!S.flipped); return; }
      const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
      if (Math.abs(dx) > 100 || (Math.abs(dx) > 45 && v > 0.6)) { commit(dx > 0); return; }
      sw.classList.add('anim'); sw.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
    };
    sw.addEventListener('pointerup', end);
    sw.addEventListener('pointercancel', () => { down = false; sw.dataset.drag = ''; sw.classList.add('anim'); sw.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; });
  }

  let busy = false;
  function commit(ok) {
    if (busy) return;
    const c = S.cards.find(x => x.id === S.currentId); if (!c) return;
    busy = true;
    const sw = stage.querySelector('.swipe');
    S.undo = { card: Object.assign({}, c) };
    const upd = Object.assign({}, c, {
      seen: c.seen + 1, last: Date.now(),
      right: c.right + (ok ? 1 : 0), wrong: c.wrong + (ok ? 0 : 1),
      box: ok ? Math.min(MAXBOX, c.box + 1) : 0
    });
    const becameLearned = ok && c.box < LEARNED && upd.box >= LEARNED;
    putCard(upd); bumpToday(1); renderStats();
    const done = () => { busy = false; advance(); toast(becameLearned ? 'Выучено: ' + upd.fi : (ok ? 'Помню' : 'Повторим позже'), true); };

      sw.classList.add('anim');
      const st = sw.querySelector(ok ? '.stamp.yes' : '.stamp.no'); if (st) st.style.opacity = 1;

  }

  // ---------- add form ----------

  async function translate(text, from, to) {
    // 1) MyMemory (free, no key)
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 5000);
      const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to, { signal: ctl.signal });
      clearTimeout(tm);
      const j = await r.json();
      const out = j && j.responseData && j.responseData.translatedText;
      if (j.responseStatus == 200 && out && !/MYMEMORY WARNING|INVALID/i.test(out)) return { text: out, via: 'MyMemory' };
    } catch {}
    // 2) Claude, when the page runs inside Claude
    if (window.claude && claude.use) {
      const sample = await claude.use('sample');
      if (sample) {
        const names = { fi: 'финского', ru: 'русского' }, namesTo = { fi: 'финский', ru: 'русский' };
        const res = await sample(
          `Переведи с ${names[from]} на ${namesTo[to]}. Это ${/\s/.test(text.trim()) ? 'фраза или предложение — переведи естественно' : 'отдельное слово — дай 1–3 основных значения через запятую, глаголы в инфинитиве'}. Ответь только переводом, без кавычек, транслитерации и пояснений.\n\n${text}`,
          { modelTier: 'quick' });
        const out = (res.text || '').trim().replace(/^["«]|["»]$/g, '');
        if (out) return { text: out, via: 'Claude' };
      }
    }
    throw new Error('no translator');
  }
  async function runTranslate(force) {

  function syncSeg() {
    document.querySelectorAll('#dir-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === S.prefs.dir)));
    document.querySelectorAll('#filter-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.prefs.filter)));
  }
  document.querySelectorAll('#dir-seg button').forEach(b => b.addEventListener('click', () => { S.prefs.dir = b.dataset.dir; ls.set(LS_PREFS, S.prefs); syncSeg(); S.flipped = false; renderStudy(true); }));
  document.querySelectorAll('#filter-seg button').forEach(b => b.addEventListener('click', () => { S.prefs.filter = b.dataset.f; ls.set(LS_PREFS, S.prefs); syncSeg(); S.recent = []; S.currentId = null; renderStudy(true); }));
  $('#btn-flip').onclick = () => setFlip(!S.flipped);
  $('#btn-yes').onclick = () => commit(true);
  $('#btn-no').onclick = () => commit(false);
  document.addEventListener('keydown', e => {
    if (view !== 'study' || document.querySelector('.scrim') || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlip(!S.flipped); }
    else if (e.key === 'ArrowRight') commit(true);
    else if (e.key === 'ArrowLeft') commit(false);
  });

  let shownSig = '';
  const sigOf = () => { const c = S.cards.find(x => x.id === S.currentId); return [S.cards.length, S.prefs.dir, S.prefs.filter, c ? c.id + c.fi + c.ru + c.type + c.box : ''].join('|'); };
  function refreshAll(enter) {
    renderStats();
    // skip re-rendering the card when nothing visible changed (e.g. our own write echoing back) or while dragging
    if (view === 'study' && !busy && !document.querySelector('.swipe[data-drag="1"]') && sigOf() !== shownSig) renderStudy(enter);
    if (view === 'list') renderList();
  }

  syncSeg(); renderToday(); refreshAll(true);
  connectDb();
})();
</script>

</body>
</html>
